#Max level entities can level up
# Default: 100
# Range: > 1
maxLevel = 100
#Amount of health humans gain on level up
# Default: 1
# Range: > 0
healthAmount = 1
#Max times humans will get the health bonus upon leveling up (can't be higher than max level)
# Default: 100
# Range: > 0
healthAmountTimes = 100
#Amount of health bonus humans get upon killing bosses
# Default: 2
# Range: > 0
healthAmountBossKills = 2
#Max times humans will get the health bonus upon killing bosses
# Default: 20
# Range: > 0
healthAmountBossKillsTimes = 20
#Amount of damage bonus humans get upon killing bosses
# Default: 1
# Range: > 0
damageAmountBossKills = 1
#Max times humans will get the damage bonus upon killing bosses
# Default: 20
# Range: > 0
damageAmountBossKillsTimes = 20
#Amount of armor bonus humans get upon killing bosses
# Default: 1
# Range: > 0
armorAmountBossKills = 1
#Max times humans will get the armor bonus upon killing bosses
# Default: 20
# Range: > 0
armorAmountBossKillsTimes = 20
#Max percentage of bonus spell power mages can get upon leveling up (50.0 = 50%)
# Default: 50.0
# Range: 0.0 ~ 1.7976931348623157E308
maxSpellPowerPercentage = 50.0
#Max percentage of bonus spell resistance mages can get upon leveling up (50.0 = 50%)
# Default: 50.0
# Range: 0.0 ~ 1.7976931348623157E308
maxSpellResistancePercentage = 50.0
#Amount of armor bonus warriors get upon leveling up
# Default: 1
# Range: > 0
armorAmountWarriors = 1
#Max times warriors will get the armor bonus upon leveling up (can't be higher than max level)
# Default: 30
# Range: > 0
armorAmountWarriorsTimes = 30
#Max percentage of bonus speed rogues can get upon leveling up (50.0 = 50%)
# Default: 50.0
# Range: 0.0 ~ 1.7976931348623157E308
maxSpeedPercentage = 50.0
#Max percentage of bonus arrow velocity archers can get upon leveling up (50.0 = 50%)
# Default: 50.0
# Range: 0.0 ~ 1.7976931348623157E308
maxArrowVelocityPercentage = 50.0
#Max percentage of bonus draw speed archers can get upon leveling up (50.0 = 50%)
# Default: 50.0
# Range: 0.0 ~ 1.7976931348623157E308
maxDrawSpeedPercentage = 50.0
#XP gain multiplier (50.0 = 50% = xp_gained * 0.5)
# Default: 100.0
# Range: 0.0 ~ 1.7976931348623157E308
xpGainedMultiplier = 100.0
#XP needed to level up multiplier (50.0 = 50% = xp_needed * 0.5)
# Default: 100.0
# Range: 0.0 ~ 1.7976931348623157E308
xpNeededMultiplier = 100.0
#Duration in seconds that immortal entities are stunned after being knocked out
# Default: 10
# Range: 1 ~ 60
immortalStunDuration = 10
#Chance of a human spawning with one of the textures from the additional textures directory (0.5 = 50%)
# Default: 0.1
# Range: 0.0 ~ 1.0
customTextureChance = 0.1
#Duration in minutes needed to be able to establish a permanent contract with a human
# Default: 200
# Range: > 1
minutesUntilPermanent = 200
#Duration in minutes contracts will last for
# Default: 10
# Range: > 1
minutesPerContract = 10
#Max amount of mercenaries that can spawn in chairs inside a 20 blocks radius.
# Default: 8
# Range: > 1
maxMercenariesInRadius = 8
#If mercenaries should attempt to use unclassified spells (set at your own risk).
attemptCastUnclassifiedSpells = false
